name: Setup OCaml + Install Dependencies
description: >-
  Composite action that installs a PINNED opam (exact version, sha256-checked
  binary), creates the repo-local OCaml switch (OCAML_VERSION, set once in the
  opam step), installs system packages,
  configures opam repos and performs a retry-loop dependency install, caching
  the opam root and switch AFTER the dependency install (C-176, C-179).  The
  switch creation and the dependency install both retry and both fail the job
  when their retries are exhausted.  Replaces the 15-line boilerplate block
  that was duplicated across 25+ CI workflows.

  It no longer uses ocaml/setup-ocaml: every setup-ocaml release resolves
  opam to the newest upstream release AT RUN TIME (v3.9.0: newest < 2.7.0;
  it has no opam-version input), so opam changed under main with no commit
  -- the class C-177 fixed for runner labels.  check_workflow_triggers.py
  refuses setup-ocaml at any ref, and refuses this file losing its exact,
  checksummed opam pin (failure mode 8).
author: Internal

inputs:
  opam-packages:
    description: >-
      Arguments passed to `opam install -y`.  Use `. --deps-only --with-test`
      (default) for project deps, or explicit package names for Coq/tooling.
    required: false
    default: ". --deps-only --with-test"
  extra-repos:
    description: >-
      Space-separated list of `name=url` pairs for additional opam repos
      (e.g. `coq-released=https://coq.inria.fr/opam/released`).
    required: false
    default: ""
  system-packages:
    description: >-
      Additional apt packages to install before opam (space-separated).
      Use for packages like libgmp-dev, pkg-config that some jobs need.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # ── System prerequisites (from former setup-ocaml action) ──────────
    - name: Install system packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Drop third-party apt repos baked into the GitHub runner image that
        # the project does not need (packages.microsoft.com azure-cli / prod).
        # These intermittently 403 / lose their signing key, making a bare
        # `apt-get update` exit 100 and kill every job that uses this action
        # (e.g. the nightly fuzz run on 2026-06-25). Removal is safe: none of
        # the packages below come from a Microsoft/Azure repo.
        sudo rm -f /etc/apt/sources.list.d/microsoft* \
                   /etc/apt/sources.list.d/*azure* 2>/dev/null || true
        sudo apt-get update
        # The multilib compilers exist for x86 only; tex-oracle runs on a
        # native arm64 runner (ADR-015 E2, OPEN-126), where apt has no
        # g++-multilib/gcc-multilib and the install would fail. Every x64
        # job installs exactly what it did before.
        multilib=""
        if [ "${RUNNER_ARCH:-X64}" = "X64" ]; then
          multilib="g++-multilib gcc-multilib"
        fi
        sudo apt-get install -y \
          bubblewrap \
          $multilib \
          mercurial \
          musl-tools \
          rsync

    # ── opam: an EXACT version, checksum-verified (C-179) ──────────────
    # The sha256s below were taken from the release binaries after their
    # GPG signatures verified against the opam dev key (fingerprint
    # 92C526AE50DF39470EB2911BED4CF1CA67CBAA92, the key setup-ocaml checks).
    # To bump: download both binaries + .sig, `gpg --verify`, then update the
    # version and BOTH sums in one commit.  The environment matches what
    # setup-ocaml v3.9.0 exported (OPAMROOT=~/.opam etc.).  Unlike
    # setup-ocaml, nothing sets DUNE_CACHE / DUNE_CACHE_ROOT any more: dune
    # runs with its own defaults.
    - name: Install opam (pinned, checksum-verified)
      if: runner.os == 'Linux' && (runner.arch == 'X64' || runner.arch == 'ARM64')
      shell: bash
      env:
        OCAML_VERSION: "5.1.1"
        OPAM_VERSION: "2.6.1"
        OPAM_SHA256_X64: "b533d393a6967150d6ef41cb3d71e147e93ecbabeb59e921aa412c0ae79ebe3d"
        OPAM_SHA256_ARM64: "8b24ef2f3f44a31763f54878454fb52afa1f2db7e00abed58b8d4e7ee7e290a6"
      run: |
        set -euo pipefail
        case "${RUNNER_ARCH}" in
          X64)   arch=x86_64; sum="${OPAM_SHA256_X64}" ;;
          ARM64) arch=arm64;  sum="${OPAM_SHA256_ARM64}" ;;
          *) echo "::error::[setup-ocaml-env] no pinned opam for ${RUNNER_ARCH}"; exit 1 ;;
        esac
        url="https://github.com/ocaml/opam/releases/download/${OPAM_VERSION}/opam-${OPAM_VERSION}-${arch}-linux"
        curl -fsSL --retry 5 --retry-all-errors -o "${RUNNER_TEMP}/opam" "${url}"
        echo "${sum}  ${RUNNER_TEMP}/opam" | sha256sum -c -
        sudo install -m 0755 "${RUNNER_TEMP}/opam" /usr/local/bin/opam
        test "$(opam --version)" = "${OPAM_VERSION}"
        {
          echo "LP_OPAM_VERSION=${OPAM_VERSION}"
          echo "LP_OCAML_VERSION=${OCAML_VERSION}"
          echo "OPAMROOT=${HOME}/.opam"
          echo "OPAMCOLOR=always"
          echo "OPAMCONFIRMLEVEL=unsafe-yes"
          echo "OPAMDOWNLOADJOBS=$(nproc)"
          echo "OPAMERRLOGLEN=0"
          echo "OPAMEXTERNALSOLVER=builtin-0install"
          echo "OPAMPRECISETRACKING=1"
          echo "OPAMRETRIES=10"
          echo "OPAMSOLVERTIMEOUT=600"
          echo "OPAMYES=1"
          echo "CLICOLOR_FORCE=1"
        } >> "${GITHUB_ENV}"

    # ── Cache: the opam root AND the switch, saved AFTER the deps ──────
    # Exact key only (no prefix restore-keys), so a hit is the state a
    # previous run built from the same inputs.  The key names everything the
    # cached state depends on that this repo controls: image OS, arch, opam
    # version, compiler, the opam files (root and latex-parse/), this
    # action's own action.yml (so editing these steps invalidates the cache)
    # and its inputs, plus the
    # ISO week, because opam-repository itself is not pinned (OPEN-136) and
    # a hit would otherwise freeze dependency versions indefinitely.
    - name: Compute the toolchain cache key
      id: opam_key
      shell: bash
      env:
        PKGS: ${{ inputs.opam-packages }}
        REPOS: ${{ inputs.extra-repos }}
        SYSPKGS: ${{ inputs.system-packages }}
      run: |
        set -euo pipefail
        h=$( { printf '%s\n' "${PKGS}" "${REPOS}" "${SYSPKGS}"; \
               cat ./*.opam ./latex-parse/*.opam "${GITHUB_ACTION_PATH}/action.yml"; } \
             | sha256sum | cut -c1-16)
        echo "key=lp-opam-v1-${ImageOS}-${RUNNER_ARCH}-opam${LP_OPAM_VERSION}-ocaml${LP_OCAML_VERSION}-${h}-$(date -u +%G-%V)" >> "${GITHUB_OUTPUT}"

    - name: Restore the opam root and switch
      id: opam_cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.opam
          _opam
        key: ${{ steps.opam_key.outputs.key }}

    # ⚠ RETRIED ON PURPOSE.  Creating the switch fetches the opam repository,
    # so a transient network fault surfaces as "... failed with exit code 40"
    # (opam Sync_error).  That is not a code failure: on PR #601 (run
    # 34732743239, attempt 1) tex-oracle died here while every other job set
    # the toolchain up on the same commit, and the same class cancelled
    # unit-tests on PR #531 (see failure mode 1 in check_workflow_triggers.py).
    # A half-built switch is discarded between attempts; exhaustion fails.
    - name: Initialise opam and the OCaml switch (cache miss)
      if: steps.opam_cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        ok=0
        for attempt in 1 2; do
          rm -rf "${OPAMROOT}" _opam
          if opam init --bare --no-setup default https://opam.ocaml.org \
             && opam switch create . --no-install --packages="ocaml-base-compiler.${LP_OCAML_VERSION}"; then
            ok=1
            break
          fi
          echo "::warning::[setup-ocaml-env] switch setup failed (attempt $attempt/2)"
          sleep 15
        done
        if [ "$ok" -ne 1 ]; then
          echo "::error::[setup-ocaml-env] opam init / switch create failed 2/2"
          exit 1
        fi

    - name: Pin the local opam packages
      shell: bash
      run: |
        set -euo pipefail
        for f in ./*.opam; do
          opam pin --no-action add "$(basename "$f" .opam).dev" .
        done
        opam config report

    # ── Extra system packages (project-specific) ──────────────────────
    - name: Install extra system packages
      if: inputs.system-packages != ''
      shell: bash
      run: |
        # Same guard as the base system-packages step: drop the broken
        # Microsoft/Azure apt repos before updating (see comment above).
        sudo rm -f /etc/apt/sources.list.d/microsoft* \
                   /etc/apt/sources.list.d/*azure* 2>/dev/null || true
        sudo apt-get update -y
        sudo apt-get install -y ${{ inputs.system-packages }}

    # ── Opam repos and dependency install with retry ──────────────────
    - name: Install opam dependencies (with retry)
      shell: bash
      run: |
        opam repo add default https://opam.ocaml.org || true
        # Add any extra repositories
        for pair in ${{ inputs.extra-repos }}; do
          name="${pair%%=*}"
          url="${pair#*=}"
          opam repo add "$name" "$url" || true
        done
        # ⚠ The loop's last command used to be `sleep 15`, so THREE failed
        # installs exited 0 and this step reported success with the
        # dependencies missing.  Under `bash -eo pipefail` a failing command
        # inside an `&&` list does not trip -e, so nothing caught it.  Track
        # success explicitly and fail loudly when the attempts are exhausted.
        installed=0
        for attempt in 1 2 3; do
          if opam update -y && opam install -y ${{ inputs.opam-packages }}; then
            installed=1
            break
          fi
          echo "[setup-ocaml-env] opam install failed (attempt $attempt/3), retrying in 15s..."
          sleep 15
        done
        if [ "$installed" -ne 1 ]; then
          echo "::error::[setup-ocaml-env] opam install failed 3/3 for:" \
               "${{ inputs.opam-packages }}"
          exit 1
        fi

    # Saved only after the dependency install succeeded, so a hit restores
    # the switch WITH its dependencies (C-179; setup-ocaml saved before them).
    - name: Save the opam root and switch
      if: steps.opam_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.opam
          _opam
        key: ${{ steps.opam_key.outputs.key }}
