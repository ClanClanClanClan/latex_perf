name: Setup OCaml + Install Dependencies
description: >-
  Composite action that sets up OCaml tooling (via ocaml/setup-ocaml@v2),
  installs system packages, filters darcs from apt, configures opam repos,
  and performs a retry-loop dependency install.  BOTH the switch setup and
  the dependency install retry; both fail the job when their retries are
  exhausted.  Replaces the 15-line
  boilerplate block that was duplicated across 25+ CI workflows.

  NOTE: This action calls ocaml/setup-ocaml@v2 DIRECTLY (not through an
  intermediate composite action) to avoid GitHub Actions post-cleanup input
  resolution failures with nested composite actions.
author: Internal

inputs:
  opam-packages:
    description: >-
      Arguments passed to `opam install -y`.  Use `. --deps-only --with-test`
      (default) for project deps, or explicit package names for Coq/tooling.
    required: false
    default: ". --deps-only --with-test"
  extra-repos:
    description: >-
      Space-separated list of `name=url` pairs for additional opam repos
      (e.g. `coq-released=https://coq.inria.fr/opam/released`).
    required: false
    default: ""
  dune-cache:
    description: Enable dune build cache via ocaml/setup-ocaml.
    required: false
    default: "true"
  system-packages:
    description: >-
      Additional apt packages to install before opam (space-separated).
      Use for packages like libgmp-dev, pkg-config that some jobs need.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # ── System prerequisites (from former setup-ocaml action) ──────────
    - name: Install system packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Drop third-party apt repos baked into the GitHub runner image that
        # the project does not need (packages.microsoft.com azure-cli / prod).
        # These intermittently 403 / lose their signing key, making a bare
        # `apt-get update` exit 100 and kill every job that uses this action
        # (e.g. the nightly fuzz run on 2026-06-25). Removal is safe: none of
        # the packages below come from a Microsoft/Azure repo.
        sudo rm -f /etc/apt/sources.list.d/microsoft* \
                   /etc/apt/sources.list.d/*azure* 2>/dev/null || true
        sudo apt-get update
        sudo apt-get install -y \
          bubblewrap \
          g++-multilib \
          gcc-multilib \
          mercurial \
          musl-tools \
          rsync

    - name: Filter darcs from privileged apt invocations (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p "$HOME/.github-tools"
        {
          printf '%s\n' '#!/usr/bin/env bash'
          printf '%s\n' 'if [[ "$1" == "apt-get" ]]; then'
          printf '%s\n' '  args=()'
          printf '%s\n' '  install_seen=false'
          printf '%s\n' '  for arg in "$@"; do'
          printf '%s\n' '    if [[ "$arg" == "install" ]]; then'
          printf '%s\n' '      install_seen=true'
          printf '%s\n' '    fi'
          printf '%s\n' '    if [[ "$install_seen" == true && "$arg" == "darcs" ]]; then'
          printf '%s\n' '      continue'
          printf '%s\n' '    fi'
          printf '%s\n' '    args+=("$arg")'
          printf '%s\n' '  done'
          printf '%s\n' '  exec /usr/bin/sudo "${args[@]}"'
          printf '%s\n' 'fi'
          printf '%s\n' 'exec /usr/bin/sudo "$@"'
        } > "$HOME/.github-tools/sudo"
        chmod +x "$HOME/.github-tools/sudo"
        echo "PATH=$HOME/.github-tools:$PATH" >> "$GITHUB_ENV"

    # ── OCaml toolchain (direct call, no intermediate composite) ───────
    #
    # ⚠ RUN TWICE ON PURPOSE.  setup-ocaml initialises the switch by fetching
    # the opam repository, so a transient network fault surfaces as
    #   "Switch initialisation failed" / "... failed with exit code 40"
    # (opam exit 40 = Sync_error, i.e. repositories could not be synchronised).
    # That is not a code failure and no amount of re-reading the diff finds it:
    # on PR #601 (run 34732743239, attempt 1) tex-oracle died here while build,
    # proof-ci, perf-ci, format, smoke and compliance all set the toolchain up
    # successfully ON THE SAME COMMIT.  The same class cancelled unit-tests on
    # PR #531 (a 25-minute network timeout in this action) -- see failure mode 1
    # in scripts/tools/check_workflow_triggers.py.
    #
    # A `uses:` step cannot be wrapped in a shell retry loop, so the retry is
    # spelled out: attempt 1 is allowed to fail, any half-built switch is
    # discarded, attempt 2 runs unguarded and its failure fails the job.
    # The two `with:` blocks MUST stay byte-identical -- enforced by failure
    # mode 4 of check_workflow_triggers.py, which runs in required spec-drift.
    - name: Set up OCaml and opam (attempt 1)
      id: setup_ocaml_attempt_1
      continue-on-error: true
      uses: ocaml/setup-ocaml@v2
      with:
        ocaml-compiler: 5.1.1
        allow-prerelease-opam: false
        opam-pin: true
        opam-depext: false
        opam-local-packages: "*.opam"
        opam-disable-sandboxing: false
        dune-cache: ${{ inputs.dune-cache }}
        cache-prefix: v1

    - name: Discard a partially-initialised switch
      if: steps.setup_ocaml_attempt_1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::[setup-ocaml-env] switch setup failed on attempt 1;" \
             "discarding any partial switch and retrying once."
        # The switch is repo-local (_opam/), so removing the directory is
        # enough; the `opam switch remove` is belt-and-braces for the case
        # where opam recorded the switch before the download failed.
        opam switch remove . -y 2>/dev/null || true
        rm -rf _opam

    - name: Set up OCaml and opam (attempt 2)
      if: steps.setup_ocaml_attempt_1.outcome == 'failure'
      uses: ocaml/setup-ocaml@v2
      with:
        ocaml-compiler: 5.1.1
        allow-prerelease-opam: false
        opam-pin: true
        opam-depext: false
        opam-local-packages: "*.opam"
        opam-disable-sandboxing: false
        dune-cache: ${{ inputs.dune-cache }}
        cache-prefix: v1

    # ── Extra system packages (project-specific) ──────────────────────
    - name: Install extra system packages
      if: inputs.system-packages != ''
      shell: bash
      run: |
        # Same guard as the base system-packages step: drop the broken
        # Microsoft/Azure apt repos before updating (see comment above).
        sudo rm -f /etc/apt/sources.list.d/microsoft* \
                   /etc/apt/sources.list.d/*azure* 2>/dev/null || true
        sudo apt-get update -y
        sudo apt-get install -y ${{ inputs.system-packages }}

    # ── Opam repos and dependency install with retry ──────────────────
    - name: Install opam dependencies (with retry)
      shell: bash
      run: |
        opam repo add default https://opam.ocaml.org || true
        # Add any extra repositories
        for pair in ${{ inputs.extra-repos }}; do
          name="${pair%%=*}"
          url="${pair#*=}"
          opam repo add "$name" "$url" || true
        done
        # ⚠ The loop's last command used to be `sleep 15`, so THREE failed
        # installs exited 0 and this step reported success with the
        # dependencies missing.  Under `bash -eo pipefail` a failing command
        # inside an `&&` list does not trip -e, so nothing caught it.  Track
        # success explicitly and fail loudly when the attempts are exhausted.
        installed=0
        for attempt in 1 2 3; do
          if opam update -y && opam install -y ${{ inputs.opam-packages }}; then
            installed=1
            break
          fi
          echo "[setup-ocaml-env] opam install failed (attempt $attempt/3), retrying in 15s..."
          sleep 15
        done
        if [ "$installed" -ne 1 ]; then
          echo "::error::[setup-ocaml-env] opam install failed 3/3 for:" \
               "${{ inputs.opam-packages }}"
          exit 1
        fi
