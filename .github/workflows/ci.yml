name: CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  format:
    runs-on: ubuntu-22.04
    # v26.4: bumped 15→30. Coq must remain in the install set —
    # `dune fmt` parses every dune file in the project, and `proofs/dune`
    # contains a `(coq.theory ...)` stanza that dune can't understand
    # without the Coq packages installed (errors out with
    # "Hint: opam install coq"). A previous attempt to drop Coq for
    # speed broke `dune fmt` itself; the right answer is more headroom,
    # not a smaller install.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ocaml-env
        with:
          opam-packages: ocamlformat.0.26.2 dune coq=8.18.0 coq-core=8.18.0
      - name: Pin formatter dependencies
        run: |
          opam pin add -y cmdliner 1.3.0
          opam pin add -y ocaml-version 3.5.0
      - name: Check formatting
        id: fmt
        run: |
          set -e
          opam exec -- dune fmt
          git diff --exit-code
      - name: Generate ocamlformat patch
        if: failure()
        run: |
          opam exec -- dune fmt || true
          git diff > ocamlformat.patch || true
      - name: Upload ocamlformat patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ocamlformat.patch
          path: ocamlformat.patch
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show revision and entry points
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=${GITHUB_SHA}"
          git rev-parse HEAD
          git --no-pager log -1 --pretty=fuller --decorate
          echo "--- entry points (core/l0_lexer) ---"
          for f in core/l0_lexer/main_service.ml \
                   core/l0_lexer/runtime_main_exe.ml; do
            if [ -f "${f}" ]; then
              echo "[#] ${f}:"
              sed -n '1p' "${f}"
            fi
          done
      - uses: ./.github/actions/setup-ocaml-env
      - name: Reset dune state
        run: |
          rm -rf _build
          opam exec -- dune clean || true
      - name: Build
        run: |
          set -euo pipefail
          # Coq proofs are now built via (coq.theory) stanza in proofs/dune;
          # the legacy coq_makefile path was removed in Week 14 to avoid
          # "Multiple rules generated for .glob" conflicts with dune.
          pushd latex-parse >/dev/null
          opam exec -- dune build
          popd >/dev/null
          opam exec -- dune build @all --display=short 2>&1 | tee _build/dune-build.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Upload dune log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dune-build-log
          path: _build/dune-build.log
          if-no-files-found: ignore
      - name: Test suite
        run: opam exec -- dune runtest
      - name: Known false-READY monotone gate (R7-INFRA-1)
        # CLI-only regression gate over corpora/false_ready/: fails if any fixed
        # false-READY regresses or a live one is silently fixed without updating
        # the manifest. pdflatex ground truth is baked into the manifest (no TeX
        # needed here); refresh locally via scripts/tools/false_ready_oracle.sh.
        run: python3 scripts/tools/check_known_false_ready.py --repo .

      - name: Apply-fixes round-trip gate (R7-INFRA-4)
        # The fixer rewrites user documents and nothing re-checked its own output,
        # so a fix that BREAKS a document was invisible. Measured: 2 of the 65
        # compile_check docs compile before the fixer and fail after
        # (good_tikz_simple, good_accents_utf8), and neither is caught by
        # --compile-check — only real pdflatex sees them.
        #
        # This step evaluates the two CLI-only properties, (a) idempotence and
        # (c) verdict-non-degradation. Property (b), oracle-class preservation,
        # needs real pdflatex and is NOT covered here; it runs in
        # pre_release_check.py locally. Wiring (b) into the tex-oracle workflow is
        # blocked on the pinned TeX image having python3, which is unconfirmed —
        # the image is deliberately dependency-free. Tracked, not silently skipped.
        #
        # Monotone like the false-READY gate: known defects live in
        # corpora/apply_fixes/manifest.json, so this lands green and fails on a
        # NEW defect or on an unrecorded improvement.
        run: python3 scripts/tools/check_apply_fixes_roundtrip.py --repo .
