# Docker Image Push to GHCR (spec W141-156)
#
# Triggered on tag push v*. Builds multi-stage OCaml image, SMOKE-TESTS it,
# and only then pushes to ghcr.io/clanclanclanclan/latex_perf.
#
# The smoke step exists because nothing ran the image before v27.1.63 was
# pushed, and that image's validators_cli (and its default REST entrypoint)
# exit 2 with Rule_contracts_missing on every input. The build is loaded into
# the local daemon first, scripts/tools/docker_smoke.sh asserts exit codes and
# non-empty findings on real documents, and the push step runs only if it
# passed (a failing step stops the job).

name: Docker Push

on:
  push:
    tags: ['v*']
  # A PR that changes the image or its smoke runs build + smoke only (every
  # push-side step is guarded by the tag condition), so a broken image is
  # caught before the tag, not by the tag.
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-push.yml'
      - 'scripts/tools/docker_smoke.sh'
      - 'scripts/tools/docker_smoke/**'
      # The image's own entrypoint and the service it runs (OPEN-127: a
      # broker defect that only the image's REST check exercised end to end).
      - 'scripts/docker_entrypoint.sh'
      - 'latex-parse/src/main_service.ml'
      - 'latex-parse/src/broker.ml'
      - 'latex-parse/src/worker.ml'
      - 'latex-parse/src/ipc.ml'
      - 'latex-parse/src/hedge_timer.ml'
      - 'latex-parse/src/hedge_timer_stubs.c'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load into the local daemon, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: latex_perf:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image (blocks the push on failure)
        run: bash scripts/tools/docker_smoke.sh latex_perf:smoke

      # The pushed bytes are the smoked bytes: the loaded image is re-tagged
      # and pushed, never rebuilt.
      - name: Push the smoked image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for t in "${TAG}" latest; do
            docker tag latex_perf:smoke "ghcr.io/clanclanclanclan/latex_perf:${t}"
            docker push "ghcr.io/clanclanclanclan/latex_perf:${t}"
          done
