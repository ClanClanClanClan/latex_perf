# OPEN-060: renamed from "Mutation Baseline". This job performs NO mutation
# testing — it scans test_*.ml for the quoted rule id, so a rule id in a
# COMMENT counts. Safe to rename: `mutation` is not among the 11 required
# contexts in .github/required-status-checks.json (verified).
name: Rule-id Test-Mention Coverage
on:
  # SCOPED DELIBERATELY (was `on: [push, pull_request]`, i.e. every branch). Same
  # duplicate-required-context defect as the twelve sibling workflows; full rationale
  # in .github/workflows/unit-tests.yml.
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-ocaml-env
      - name: Build rule-id mention scan
        run: opam exec -- dune build latex-parse/src/test_mutation_baseline.exe
      - name: Run rule-id mention scan
        run: opam exec -- ./_build/default/latex-parse/src/test_mutation_baseline.exe
