name: Performance Gate CI

on:
  push:
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  perf-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ocaml-env

      - name: Build benches
        run: |
          opam exec -- dune build latex-parse/bench/ab_microbench.exe latex-parse/bench/edit_window_bench.exe latex-parse/bench/first_token_latency.exe
          opam exec -- dune build latex-parse/src/bench_readiness_kernel.exe latex-parse/src/validators_cli.exe

      - name: Full-doc perf gate (quick)
        run: |
          opam exec -- bash scripts/perf_gate.sh corpora/perf/perf_smoke_big.tex 50

      - name: Edit-window gate (quick)
        run: |
          opam exec -- bash scripts/edit_window_gate.sh corpora/perf/edit_window_4kb.tex 1000

      - name: First-token gate (quick)
        run: |
          opam exec -- bash scripts/first_token_gate.sh corpora/perf/edit_window_4kb.tex 1000 4096

      # R-BUDGET. The three gates above measure the L0 LEXER: ab_microbench and
      # first_token on the tokenizer, and edit_window on Real_processor.run over
      # a random 4096-byte slice. None of them touches the stages ROADMAP.md:276
      # actually budgets (parse / shared / rules / structural / IPC at 300 KB).
      # Measured consequence: edit_window_gate reports p95 = 0.031 ms on a
      # 300 KB document while the `rules` stage of that same document is ~11x
      # OVER its 30 ms budget. This step closes that hole by measuring the
      # readiness kernel per stage at real sizes, plus the batch full-lint pass
      # which ROADMAP.md:80 (Principle 9) requires a budget for and never had.
      #
      # It is a monotone REGRESSION ratchet against a recorded baseline, not a
      # pass/fail against the spec budget — the spec budget is currently missed,
      # and a red-on-arrival required gate would block every merge. The gap is
      # printed on every run and the gate fails if it WIDENS.
      - name: Keystroke + batch latency budget (R-BUDGET)
        run: |
          opam exec -- python3 scripts/tools/check_keystroke_budget.py --repo . --reps 9

      # The baseline shipped in this repo was recorded on a loaded developer
      # machine and is marked provisional, which makes the ratchet LOOSE. Print
      # what an idle runner actually measures so the first maintainer to look
      # can re-record from these numbers rather than from a laptop.
      - name: Wedge bench (R-BENCH, informational)
        run: |
          opam exec -- bash scripts/bench_wedge.sh 9

      - name: Slack notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            TXT="🚨 perf-ci gate failed for $GITHUB_REPOSITORY. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            curl -s -X POST -H 'Content-type: application/json' --data "{\"text\": \"${TXT}\"}" "$SLACK_WEBHOOK_URL" || true
          else
            echo "[perf-ci] SLACK_WEBHOOK_URL not set; skipping Slack notification"
          fi

      - name: Email notify on failure
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Perf CI gate failed: ${{ github.repository }}"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Performance CI gate failed.
            Repo: ${{ github.repository }}
            Run:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
