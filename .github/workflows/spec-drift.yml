# Spec Drift Gate (v26 WS0)
#
# Ensures no public document disagrees with governance/project_facts.yaml.
# Runs check_repo_facts.py on every push and PR.

name: Spec Drift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job name is the GitHub status-check context. Renamed from the
  # generic [check] (which collided with another workflow's job of
  # the same name) to [spec-drift] so it can be unambiguously added
  # to branch-protection's required-checks list.
  spec-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - name: Check project facts consistency
        run: python3 scripts/tools/check_repo_facts.py --facts governance/project_facts.yaml --repo .

      - name: Check rule contracts drift (PR #241 p1.3)
        # Runtime-vs-contract binding: every Class C id in
        # execution_class.ml has execution_class=C in rule_contracts.yaml.
        # JSON mirror matches YAML. Every spec id has a contract. Acyclic.
        run: python3 scripts/tools/check_rule_contracts.py --repo .

      - name: Check catalogue compliance
        run: python3 scripts/validate_catalogue.py

      - name: Check fix-type consistency (OPEN-028)
        # rules_v3.yaml `fix:` vs rule_contracts `produces_fix`, three-way:
        # auto-apply ships a fix => token; Bucket C ships via the CANDIDATE
        # channel => token AND a real producer; ships nothing => null.
        # ⚠ This gate existed but ran in NO workflow, so it sat RED on main on
        # 26 rules and would first have surfaced during a release. It is wired
        # here only now that it is green AND correct — it used to be wrong
        # about 18 of those 26.
        run: python3 scripts/tools/check_fix_type_consistency.py

      - name: Check regression gates (PR #241 p1.6, extended p1.9)
        # Ratchets that prevent previously-closed issues from reopening:
        # 1. _CoqProject lists every non-archive proof file
        # 2. Rule IDs in rule_contracts.yaml match FAMILY-NNN
        # 3. (p1.9) Runtime-emitted IDs must appear in rule_contracts
        # 4. (p1.9) No lowercase rule IDs in validator sources
        # 5. Mutation-uncovered count does not grow (skipped here; run
        #    in unit-tests workflow where mutation binary is built)
        run: python3 scripts/tools/check_regression_gates.py --skip-mutation

      - name: Check memo file-list presence (PR #245 p1.9)
        # Every memo §16.1 + §16.2 "Files to create" bullet must resolve
        # to a repo path (directly or via documented alias). Would have
        # caught round-7 gaps (DependencyInvalidation.v, log_context.ml)
        # before merge.
        run: python3 scripts/tools/check_memo_files.py --repo .

      - name: Check docstring theorem counts (PR #245 p1.9)
        # P1.8 found docs/PROOFS.md + PROOF_GUIDE.md said 1,157 theorems
        # but governance said 1,181. Extended check_repo_facts covers
        # this now.
        run: python3 scripts/tools/check_repo_facts.py --facts governance/project_facts.yaml --repo .

      - name: "Meta-gate: required status checks are unambiguous"
        # The job id IS the status-check context. This gate asserts that every
        # context in .github/required-status-checks.json resolves to exactly one
        # job, and that no such job sits behind an unfiltered `push:` (which
        # publishes the same required context twice per commit on a PR branch --
        # the defect that blocked PR #531 with a cancelled duplicate run while
        # the real run had passed). Also catches an orphaned requirement after a
        # job rename, which hangs every PR pending with nothing to point at.
        run: python3 scripts/tools/check_workflow_triggers.py --repo .

      - name: "Meta-gate: every gate script is runnable"
        # P1.8 found check_regression_gates had a typo'd binary name.
        # This gate verifies every gate-script itself runs without
        # tracebacks or empty output.
        run: python3 scripts/tools/check_gates_meta.py --repo .

      - name: Severity drift (PR #245 p1.10)
        # Every rule's default_severity in rules_v3.yaml must match the
        # severity = ... literal in the OCaml rule body. Catches the
        # case where someone edits one without the other.
        run: python3 scripts/tools/check_severity_drift.py --repo .

      - name: MLI docstring coverage (PR #245 p1.10, ratchet)
        # Ratchets the count of undocumented exported vals. Blocks new
        # undocumented vals; existing ones can be added progressively.
        run: python3 scripts/tools/check_mli_doc_coverage.py --repo .

      - name: Code quality (PR #245 p1.10)
        # Three sub-gates: no [Defined.] in load-bearing proofs, no
        # silent wildcard-exception swallows in non-test OCaml, no
        # trivially-passing test assertions.
        run: python3 scripts/tools/check_code_quality.py --repo .

      - name: Unused hypotheses in proofs (PR #245 p1.10)
        # Flag proof bodies whose [intros] discards ≥2 hypotheses via
        # bare `_`. Would have caught the round-5 RepairMonotonicity
        # regression where 3 boundary hypotheses were ignored.
        run: python3 scripts/tools/check_unused_hypotheses.py --repo .

      - name: Doc cross-references (PR #245 p1.11)
        # Every [text](path) link and `path.ext` backtick mention in
        # docs/ and specs/ must resolve to an existing file.
        run: python3 scripts/tools/check_doc_refs.py --repo .

      - name: Roadmap fact drift (v27.1.60)
        # docs/v27/ROADMAP.md restates load-bearing numbers (version,
        # producer/candidate counts, proof-file/theorem/admit/axiom counts,
        # the differential confusion-matrix tuple, false-READY count, LP-Core
        # %). Each is asserted against its authoritative generated source
        # (project_facts.yaml, FIX_PRODUCER_LEDGER.md, CANDIDATE_BACKLOG.md,
        # COMPILATION_GUARANTEE.md, the KNOWN_FALSE_READY allowlist). Closes
        # the R-count-authority hole: no existing gate caught the roadmap
        # restating a stale count.
        run: python3 scripts/tools/check_roadmap_facts.py --repo .

      - name: Project state is the single source of truth (v27.1.63)
        # docs/v27/PROJECT_STATE.md states where the project actually is. Its
        # numeric block is REGENERATED from the artefacts that own those numbers
        # and diffed, so it cannot drift the way ROADMAP.md's hand-typed numbers
        # did. Also enforces the ledger discipline (unique OPEN ids, evidence,
        # sizes) that lets a future session pick the work up.
        run: python3 scripts/tools/check_project_state.py --repo .

      - name: Fix-safety language (v27.1.63)
        # No document may call the AUTO-FIX channel "proven-safe". Until
        # v27.1.63 four places did, while `grep -rlniE 'fix_guard|apply_fixes'
        # proofs/` returned nothing and corpora/apply_fixes/manifest.json
        # recorded rows where --apply-fixes took a compiling document to a
        # non-compiling one. check_doc_refs.py cannot see this class: its scope
        # is path existence, not claims.
        run: python3 scripts/tools/check_fix_safety_language.py --repo .

      - name: Doc version-label currency (v27.0.68.2)
        # Headings/stamps that name a version or fix-producer count
        # ("Current State (vN)", "latest tag vN", "N as of vN", ...) must
        # match dune-project / rule_contracts.yaml. Catches the label drift
        # that check_doc_refs cannot (it only checks path existence).
        run: python3 scripts/tools/check_version_labels.py --repo .

      - name: Release integrity (PR #245 p1.11)
        # CHANGELOG↔governance version coherence, generated-file
        # authenticity (regen+diff), orphan consumes capabilities.
        run: python3 scripts/tools/check_release_integrity.py --repo .

      - name: Check support matrix yaml parses
        run: |
          python3 - <<'PY'
          import yaml, sys
          from pathlib import Path
          p = Path("docs/SUPPORT_MATRIX.yaml")
          if not p.is_file():
              print("FAIL: missing", p, file=sys.stderr); sys.exit(1)
          data = yaml.safe_load(p.read_text())
          for section in ("engines", "document_modes", "macro_support",
                          "proof_classes", "interfaces", "execution_classes"):
              if section not in data:
                  print(f"FAIL: missing section {section}", file=sys.stderr); sys.exit(1)
          print(f"[support_matrix] PASS: v{data['version']} with {len(data)} sections")
          PY
