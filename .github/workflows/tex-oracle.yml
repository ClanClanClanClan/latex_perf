name: TeX Oracle (real pdflatex)

# R7-INFRA-2 / S-CI-TEX — put a REAL pdflatex in CI.
#
# Until this workflow, `.github/workflows/` contained zero texlive and the only
# `pdflatex` string in CI was a comment. Both pdflatex-dependent scripts exit 0
# when the binary is absent, so they had never run in CI at all — which means
# every "0 over-rejection on N real papers" claim across the round-7 fix trains
# was a manual local sweep that nobody else could reproduce. This makes those
# claims machine-checked and reproducible by anyone.
#
# REQUIRED since #534. This block used to say "ADVISORY ON PURPOSE (for now)"
# and "deliberately NOT listed in .github/required-status-checks.json", and it
# went on saying so for months after the context was listed there (OPEN-085).
# The soak it describes as future work has happened. The reasoning below is
# kept because it still explains the COST of the promotion, which is real:
# branch-protection.yml PUTs enforce_admins: true, so a red tex-oracle is an
# unbypassable block. That is now the accepted trade, not a hazard to avoid.
# Historical rationale for the original advisory period:
#   * branch-protection.yml PUTs enforce_admins: true, so a red REQUIRED check
#     here would be unbypassable even by the maintainer, and would stall every PR
#     in the repo;
#   * this is the repo's first Docker pull on the PR path — a new failure surface
#     that has nothing to do with the property being gated.
# The invisibility problem is solved the moment this runs on every PR and prints
# the engine version into the log. Promote to required after a soak (~10 green
# runs), by editing .github/required-status-checks.json — never via the API,
# which branch-protection.yml would overwrite.
#
# NOTE: never add a `paths:` filter here. A required context whose workflow does
# not run on a given PR stays pending forever, which would block promotion.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ── PINNED ORACLE ENGINE — see docs/COMPILATION_GUARANTEE.md § SO1 ──────────
  # texlive/texlive:latest-medium as of 2026-07-26. Verified from the registry:
  # this is the multi-arch OCI *index* digest (NOT a per-arch manifest digest,
  # which would lock the runner architecture), and it is byte-identical to the
  # immutable dated tag
  #   registry.gitlab.com/islandoftex/images/texlive:TL2026-2026-07-26-medium
  # so it is anchored and cannot be garbage-collected as an untagged orphan.
  #
  # scheme-medium, not -small: two corpus documents use [T1]{fontenc}, and
  # cm-super/lm live in collection-fontsrecommended, which -small omits. Without
  # them TeX synthesises bitmap fonts at run time — slow, and exactly the class of
  # environment-dependent behaviour that makes an oracle unreliable.
  #
  # Re-pinning is a DELIBERATE PR: bump both vars, re-run false_ready_oracle.sh
  # with STRICT_GRADE=1 and re-record corpora/false_ready/manifest.json, then
  # update the SO1 section and specs/v26/compilation_profiles.yaml.
  # 2026-09-04 (OPEN-040/C-38): digest moved to the FULL-scheme TL2026 image —
  # SAME pinned engine (pdfTeX 3.141592653-2.6-1.40.29; the assert below still
  # holds), completed TREE. The previous digest was scheme-partial: no
  # xy.tex/xypic.tex, so a tree-dependent fixture graded strong-fatal against
  # an oracle whose tree did not match the one the ground truth was recorded
  # on, and `\include{xy}` of the then-missing file silently COMPILED. The
  # tree is now part of the pin: the canary below proves every
  # Texmf_tree_allowlist name compiles before anything is graded.
  TEX_IMAGE: texlive/texlive@sha256:4984977ccf5afe883cb382d0163f267de0d029d140bb7a9e8f4c19f0b781d57b
  TEX_EXPECT_VERSION: 3.141592653-2.6-1.40.29

jobs:
  tex-oracle:
    name: tex-oracle
    # THE ARCHITECTURE OF RECORD (ADR-015 E2, E9; OPEN-126). The pinned digest
    # is a multi-arch index, and the pinned pdfTeX gives different VERDICTS on
    # its arm64 and amd64 images for some documents (C-103: `\pdfsnapy 0pt`
    # exits 0 on aarch64, 136 on x86_64). Every recorded grade this job
    # compares against was taken on aarch64, so the job runs on GitHub's
    # NATIVE arm64 runner (free for public repositories) and the image
    # resolves to its arm64 member; `_oracle.py` refuses to grade on any
    # other architecture, and check_oracle_pin.py refuses this line changing.
    #
    # ONE LAUNCH DEFINITION (ADR-015 E15, owner 2026-10-06; OPEN-128 (4)).
    # Every step below runs the project's graders ON THE RUNNER HOST, which
    # has docker, and they reach the engine only through
    # scripts/tools/_oracle.py, which starts one fresh container of the pinned
    # image per run (ContainerOracle.launch_argv) -- exactly as on a laptop.
    # Until OPEN-128 this job started the image itself (`docker run ...
    # LP_ORACLE_IN_IMAGE=...`) and graded inside it with a launch
    # configuration of its own (a 4g /tmp without noexec, its work
    # directories on that /tmp), the "native backend": two launch definitions
    # kept in step by hand. That backend is retired, `_oracle.py` refuses
    # LP_ORACLE_IN_IMAGE, and check_oracle_pin.py refuses any workflow step
    # that starts the image (`docker run`/`exec`/`create`/`start` naming it).
    # The claim is one CONFIGURATION by construction, not one PLATFORM: what
    # still differs between this runner and a laptop's VM is measured in
    # corpora/oracle_baseline/platform_residuals.json (OPEN-128 (8)).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # OCaml is set up on the RUNNER (setup-ocaml-env needs sudo/apt).
      - uses: ./.github/actions/setup-ocaml-env

      - name: Build validators CLI
        run: opam exec -- dune build latex-parse/src/validators_cli.exe

      - name: Pull pinned TeX Live image
        run: docker pull "$TEX_IMAGE"

      - name: Assert engine pin (a MISMATCH here is not oracle drift)
        run: |
          set -euo pipefail
          # `_oracle.py version` starts the oracle: its session probe checks,
          # in a container of the one launch definition, the TeX tree's
          # fingerprints for aarch64 (ADR-012 decision 7: the banner pins the
          # engine BINARY, never the macro layer), the read-only root, the
          # non-root user, the image's environment and the pinned shim.
          got=$(python3 scripts/tools/_oracle.py version | tail -1)
          man=$(python3 -c "import json;print(json.load(open('corpora/false_ready/manifest.json'))['oracle']['version'])")
          echo "image    : $got"
          echo "manifest : $man"
          case "$got" in *"$TEX_EXPECT_VERSION"*) ;; *)
            echo "::error::PIN MISMATCH: the oracle reports '$got', workflow pins '$TEX_EXPECT_VERSION'. This is NOT a soundness regression and NOT oracle drift — re-pin TEX_IMAGE or re-record the manifest. Do not disable this gate."
            exit 1 ;; esac
          case "$man" in *"$TEX_EXPECT_VERSION"*) ;; *)
            echo "::error::PIN MISMATCH: manifest oracle.version '$man' != pinned '$TEX_EXPECT_VERSION'."
            exit 1 ;; esac
          # Same assertion for the apply-fixes corpus, which property (b) grades.
          amn=$(python3 -c "import json;print(json.load(open('corpora/apply_fixes/manifest.json'))['oracle']['version'])")
          echo "apply_fixes manifest : $amn"
          case "$amn" in *"$TEX_EXPECT_VERSION"*) ;; *)
            echo "::error::PIN MISMATCH: corpora/apply_fixes/manifest.json oracle.version '$amn' != pinned '$TEX_EXPECT_VERSION'. Re-record property (b) against the pinned image."
            exit 1 ;; esac
          python3 scripts/tools/_oracle.py info

      # The anti-silent-green measure. A missing .sty grades identically to the
      # intended fatal (strong-fatal), so an under-provisioned image would let
      # fixtures report `ok` while testing nothing. Prove the install can compile
      # the corpus feature set BEFORE grading anything -- through the oracle
      # (scripts/tools/oracle_canary.py), not by starting the image here.
      - name: TeX install canary
        run: |
          set -euo pipefail
          python3 scripts/tools/oracle_canary.py | tee /tmp/canary.log
          grep -q 'canary OK' /tmp/canary.log || {
            echo "::error::The canary produced no completion marker. Refusing to grade fixtures against an unproven TeX install."
            exit 1; }

      # Parse the manifest on the RUNNER and hand the TSV in.
      - name: Emit fixture list
        run: |
          set -euo pipefail
          bash scripts/tools/false_ready_oracle.sh --emit-fixtures > /tmp/fixtures.tsv
          got=$(wc -l < /tmp/fixtures.tsv | tr -d ' ')
          want=$(python3 -c "import json;print(len(json.load(open('corpora/false_ready/manifest.json'))['fixtures']))")
          echo "fixtures: $got (manifest: $want)"
          # The oracle derives its own expected count FROM this file, so a short
          # TSV would silently shrink the check rather than fail it.
          [ "$got" -eq "$want" ] || {
            echo "::error::fixture TSV has $got rows but the manifest lists $want — refusing to grade a partial corpus."
            exit 1; }

      # THE BLOCKING CHECK: every fixture must still be rejected by real
      # pdflatex. HARD drift only — a strong-fatal <-> error-halt
      # reclassification is reported but does not fail, because that
      # distinction moves with the font install rather than with soundness.
      - name: False-READY oracle (real pdflatex, all fixtures)
        env:
          REQUIRE_PDFLATEX: "1"
          FR_FIXTURE_TSV: /tmp/fixtures.tsv
        run: |
          set -euo pipefail
          FR_EXPECT_ENGINE="$TEX_EXPECT_VERSION" bash scripts/tools/false_ready_oracle.sh

      # ADVISORY: a measurement of the soundness residual, not a regression gate.
      - name: Differential vs pdflatex (65-doc corpus) — advisory
        continue-on-error: true
        env:
          REQUIRE_PDFLATEX: "1"
        run: |
          set -euo pipefail
          EXPECT_TEX_VERSION="$TEX_EXPECT_VERSION" bash scripts/tools/diff_compile_check.sh

      # C-99 (OPEN-118 review rounds 3-4): real documents that forge the
      # oracle's evidence must be REFUSED by the real pdfTeX run through the
      # real supervisor, and genuine shapes must still grade. On this runner
      # the work root is case-sensitive ext4; on a Mac it is virtiofs over
      # APFS (case- and Unicode-insensitive): the forgery set covers both.
      - name: Oracle forgery kill-tests (real pdfTeX, real supervisor)
        env:
          REQUIRE_PDFLATEX: "1"
        run: python3 scripts/tools/check_oracle_forgery.py

      # R7-INFRA-4 property (b): "a document that compiled must still compile
      # after --apply-fixes". BLOCKING since v27.1.63: the ONLY check anywhere
      # that can observe --apply-fixes turning a compiling document into a
      # non-compiling one. Its baseline is graded under the same oracle
      # (corpora/apply_fixes/manifest.json, whose oracle block names the
      # architecture and the clock).
      - name: Apply-fixes round-trip, property (b)
        env:
          REQUIRE_PDFLATEX: "1"
        run: python3 scripts/tools/check_apply_fixes_roundtrip.py --repo .

      # OPEN-128 (8): ONE CONFIGURATION, TWO PLATFORMS. Every document of the
      # platform set is graded here and compared, per document, with the
      # grades of record in corpora/oracle_baseline/platform_residuals.json
      # (taken at one commit on both sides: the laptop's colima VM and this
      # runner). A document whose grade differs from the recorded grade FOR
      # THIS PLATFORM fails the step; the recorded per-platform grades, and
      # the documents whose grades differ between the platforms, are the
      # residuals the owner chooses O3.2/O3.3 on. The grades are uploaded.
      - name: Platform residuals (per-document grades on this runner)
        run: |
          set -euo pipefail
          python3 scripts/tools/check_oracle_platforms.py --grade --platform ci \
            --out /tmp/platform_ci.json
          python3 scripts/tools/check_oracle_platforms.py --check /tmp/platform_ci.json

      - name: Upload the platform grades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-grades-ci
          path: /tmp/platform_ci.json
          if-no-files-found: warn
