name: Validators Pilot Smoke (CLI)

on:
  # SCOPED DELIBERATELY (was a bare `push:`). A bare `push:` fires on every branch,
  # so a PR branch published this workflow's check twice per commit under the same
  # required-context name. Full rationale in .github/workflows/unit-tests.yml.
  push:
    branches: [main]
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  smoke-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ocaml-env

      - name: Build CLI
        run: |
          opam exec -- dune build latex-parse/src/validators_cli.exe

      - name: Run CLI pilot smoke
        env:
          L0_VALIDATORS: pilot
        run: |
          bash scripts/smoke_rules_pilot_cli.sh

      - name: Install python deps for gates
        run: pip install pyyaml

      - name: Producer coverage + correctness gate
        run: python3 scripts/tools/check_producer_coverage.py

      - name: Apply-fixes convergence safety
        run: python3 scripts/tools/check_apply_fixes_safety.py --repo .

      - name: Verbatim safety
        run: python3 scripts/tools/check_verbatim_safety.py --repo .

      - name: Regex-vs-AST parity (OPEN-091)
        # ⚠ THIS GATE RAN IN NO AUTOMATED PATH AT ALL until 2026-09-12. It sits
        # in pre_release_check.py's BUILD_CHECKS list, and release.sh invokes
        # that script with --skip-build, which skips the entire list — so it
        # fired neither per-PR nor at release. It is the THIRD instance of this
        # exact defect in this repo; ci.yml and tex-oracle.yml both carry
        # comments recording the previous two. It needs the built CLI, which is
        # why it lives in this job and not in spec-drift.
        run: python3 scripts/tools/check_ast_parity.py --repo .
