name: Week 1 Validation Pipeline
# LaTeX Perfectionist v25 - CI/CD Setup

on:
  push:
    branches: [ main, dfa-prototype ]
  pull_request:
    branches: [ main ]


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  coq-compilation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-ocaml-env
      with:
        opam-packages: coq.8.18.0 coq-mathcomp-ssreflect.1.17.0
        extra-repos: coq-released=https://coq.inria.fr/opam/released

    - name: Build core proof suite
      run: |
        eval $(opam env)
        coqc -Q proofs LaTeXPerfectionist proofs/Catcode.v
        coqc -Q proofs LaTeXPerfectionist proofs/CoreProofs.v
        coqc -Q proofs LaTeXPerfectionist proofs/LexerFaithfulStep.v
        coqc -Q proofs LaTeXPerfectionist proofs/LexerSmallstep.v
        coqc -Q proofs LaTeXPerfectionist proofs/LexerTotality.v

  admit-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Count Admits
      run: |
        # PR #244 (p1.7): strict regex — match only `Admitted.` / `admit.`
        # as tactics at line start, not the word "admits" in comments or
        # definition names like `foo_zero_admits` (which are markers, not
        # admits). Exclude archive dirs.
        ADMIT_COUNT=$(find proofs -name "*.v" ! -name "*.disabled" ! -path "*/archive/*" -exec grep -cE '^\s*(Admitted\.|admit\.)' {} \; | awk '{sum += $1} END {print sum}')
        echo "Total strict admits found: $ADMIT_COUNT"

        # Zero admits, aligned with proof.yml's gate. The old ≤60 ceiling was a
        # v26-era "historical safety net" that had long since stopped describing
        # reality (the tree has been at 0 for many releases) — it meant this
        # workflow would stay green through sixty regressions. A tolerance nobody
        # intends to use is not a safety net, it is a hole.
        if [ "$ADMIT_COUNT" -gt 0 ]; then
          echo "FAIL: admits found ($ADMIT_COUNT); the tree must stay at zero"
          exit 1
        else
          echo "PASS: zero admits"
        fi

    - name: Check for Axioms
      run: |
        # Aligned with proof.yml: match `Axiom` AND `Parameter`, tolerate leading
        # whitespace, and exclude archive/. The previous `grep -c "^Axiom"` missed
        # every `Parameter`, every indented `  Axiom`, and scanned archive/ (which
        # the admit check above already excludes) — three ways to pass while an
        # unproved assumption sat in the tree.
        AXIOM_COUNT=$(find proofs -name "*.v" ! -name "*.disabled" ! -path "*/archive/*" -exec grep -cE '^\s*(Axiom|Parameter)\b' {} \; | awk '{sum += $1} END {print sum}')
        echo "Total axioms found: $AXIOM_COUNT"

        if [ "$AXIOM_COUNT" -gt 0 ]; then
          echo "❌ FAIL: Axioms found ($AXIOM_COUNT)"
          echo "v25 specification requires zero axioms"
          exit 1
        else
          echo "✅ PASS: No axioms found"
        fi

  ocaml-compilation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-ocaml-env
      with:
        opam-packages: dune re yojson angstrom uutf ppx_deriving

    - name: Build latex-parse components
      run: |
        eval $(opam env)
        dune build --root latex-parse

    - name: Validator CLI smoke test
      run: |
        eval $(opam env)
        TEX_SAMPLE="$PWD/corpora/l1/CMD-001_unused_newcommand.tex"
        dune exec --root latex-parse -- src/validators_cli.exe --layer l1 "$TEX_SAMPLE" > /tmp/validator.out
        grep "CMD-001" /tmp/validator.out

